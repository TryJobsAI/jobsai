name: Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate backend
    if: github.repository == 'TryJobsAI/jobsai'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobsai
          POSTGRES_PASSWORD: jobsai
          POSTGRES_DB: jobsai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobsai -d jobsai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://jobsai:jobsai@127.0.0.1:5432/jobsai_test
      JOBSAI_DB_INTEGRATION: "1"
      JOBSAI_ANVIL_INTEGRATION: "1"
      MAX_ACTIVE_CLAIMS_PER_WALLET: "2"
      RH_CHAIN_ID: "46630"
      RH_RPC_URL: http://127.0.0.1:8545
      USDG_TOKEN_ADDRESS: ""
      USDG_DECIMALS: "6"
      RH_CONFIRMATIONS: "1"
      AUTH_DOMAIN: localhost
      AUTH_URI: http://localhost:3001
      AUTH_TOKEN_PEPPER: jobsai-ci-auth-pepper-0123456789abcdef
      DATA_ENCRYPTION_KEY: jobsai-ci-encryption-key-0123456789abcdef
      JOBSAI_TEAM_PASSWORD: jobsai-ci-team-password-0123456789abcdef
      GAS_WALLET_PRIVATE_KEY: "0x1111111111111111111111111111111111111111111111111111111111111111"
      CRON_SECRET: jobsai-ci-cron-secret-0123456789abcdef
      TEAM_WALLET_ADDRESSES: "0x2222222222222222222222222222222222222222"
      TRUST_PROXY: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: 1.4.2

      - name: Install backend dependencies
        working-directory: backend
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Type-check backend
        working-directory: backend
        run: bun run check

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf
        with:
          version: v1.8.5

      - name: Start local Anvil chain
        run: |
          anvil_key=$(printf '0x%s%s%s%s' 'ac0974bec39a17e3' '6ba4a6b4d238ff94' '4bacb478cbed5efc' 'ae784d7bf4f2ff80')
          echo "ANVIL_TEST_PRIVATE_KEY=$anvil_key" >> "$GITHUB_ENV"
          unset anvil_key
          anvil --chain-id 46630 --host 127.0.0.1 --port 8545 --accounts 10 --balance 10000 >/tmp/jobsai-anvil.log 2>&1 &
          for attempt in $(seq 1 30); do
            if cast chain-id --rpc-url "$RH_RPC_URL" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          test "$(cast chain-id --rpc-url "$RH_RPC_URL")" = "46630"

      - name: Deploy local USDG mock
        working-directory: backend
        run: |
          forge create contracts/MockUSDG.sol:MockUSDG --rpc-url "$RH_RPC_URL" --private-key "$ANVIL_TEST_PRIVATE_KEY" --broadcast --json >/tmp/jobsai-usdg-deployment.json
          address=$(python3 -c 'import json; print(json.load(open("/tmp/jobsai-usdg-deployment.json"))["deployedTo"])')
          echo "USDG_TOKEN_ADDRESS=$address" >> "$GITHUB_ENV"

      - name: Run unit, PostgreSQL, and Anvil settlement tests
        working-directory: backend
        run: bun test --coverage --coverage-reporter=lcov --parallel=2

      - name: Enforce settlement line coverage
        working-directory: backend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          records = Path("coverage/lcov.info").read_text().split("end_of_record")
          record = next((r for r in records if "SF:src/settlement.ts" in r), None)
          if record is None:
              raise SystemExit("No settlement.ts coverage record was generated")
          values = {line.split(":", 1)[0]: int(line.split(":", 1)[1]) for line in record.splitlines() if line.startswith(("LF:", "LH:"))}
          total, hit = values.get("LF", 0), values.get("LH", 0)
          percent = (100 * hit / total) if total else 0
          print(f"settlement.ts line coverage: {hit}/{total} ({percent:.1f}%)")
          if percent < 85:
              raise SystemExit("settlement.ts line coverage is below 85%")
          PY

  gitleaks:
    name: Scan repository history for secrets
    if: github.repository == 'TryJobsAI/jobsai'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.27.1
          cache: false

      - name: Run Gitleaks
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner .

  semgrep:
    name: Scan TypeScript and secrets with Semgrep
    if: github.repository == 'TryJobsAI/jobsai'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: 3.12.10

      - name: Install pinned Semgrep
        run: python -m pip install --disable-pip-version-check semgrep==1.182.1

      - name: Run Semgrep rulesets
        run: semgrep scan --error --metrics off --config p/typescript --config p/secrets .

  package:
    name: Build and publish backend image
    needs: [validate, gitleaks, semgrep]
    if: github.repository == 'TryJobsAI/jobsai' && (github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/tryjobsai/jobsai-backend" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: metadata
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build backend image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  deploy:
    name: Trigger backend deployment
    needs: package
    if: github.repository == 'TryJobsAI/jobsai' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.BACKEND_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Set BACKEND_DEPLOY_HOOK_URL in the production environment secrets."
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK"
          echo "Backend deploy hook triggered."

      - name: Verify deployed backend commit
        env:
          HEALTH_URL: https://jobsai-api.onrender.com/health
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          deadline=$(( $(date +%s) + 600 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            response=$(curl --connect-timeout 10 --max-time 20 --fail --silent --show-error "$HEALTH_URL" 2>/dev/null || true)
            actual_sha=$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("gitSha", ""))' 2>/dev/null || true)
            if [ "$actual_sha" = "$EXPECTED_SHA" ]; then
              echo "Live backend reports expected SHA $EXPECTED_SHA."
              exit 0
            fi
            echo "Waiting for backend SHA $EXPECTED_SHA; current response: ${actual_sha:-unavailable}"
            sleep 15
          done
          echo "::error::Backend did not report $EXPECTED_SHA at $HEALTH_URL within 10 minutes."
          exit 1

  release:
    name: Create backend release
    needs: deploy
    if: github.repository == 'TryJobsAI/jobsai' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - id: tag
        name: Create release tag
        run: echo "name=backend-$(date -u +%Y%m%d%H%M)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Push release tag
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: git tag "$RELEASE_TAG" && git push origin "$RELEASE_TAG"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
